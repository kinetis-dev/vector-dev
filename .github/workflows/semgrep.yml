name: Semgrep

on:
  push:
    branches: [main]
  pull_request:

# One run per branch at a time: a superseded PR push cancels the older
# run outright; on main nothing is cancelled, but stacked pushes queue
# as at most one pending run instead of piling up behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # the SARIF upload to code scanning
      security-events: write
      actions: read
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7

      - name: Run Semgrep
        # Kinetis's rulesets, plus p/typescript for @kinetis/vector-ui and
        # the demo frontend. --error makes a real finding fail the build —
        # .semgrepignore covers the known false positives (see that
        # file's own comments), confirmed clean (0 findings) before
        # adding this.
        run: semgrep scan --config=p/php --config=p/security-audit --config=p/secrets --config=p/typescript --error --sarif --output=semgrep.sarif

      - name: Upload SARIF to code scanning
        # Soft-fails rather than reddening the run over a dashboard step
        # when code scanning is unavailable for the repository.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
