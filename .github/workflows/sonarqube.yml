name: SonarQube Cloud

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'demo/backend/**'
      - 'demo/docker/**'
      - 'sonar-project.properties'
      - '.github/scripts/php'
      - '.github/workflows/sonarqube.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/**'
      - 'demo/backend/**'
      - 'demo/docker/**'
      - 'sonar-project.properties'
      - '.github/scripts/php'
      - '.github/workflows/sonarqube.yml'

permissions:
  contents: read

# One run per branch at a time: a superseded PR push cancels the older
# run outright; on main nothing is cancelled, but stacked pushes queue
# as at most one pending run instead of piling up behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # See ci.yml: the job's own token for what the Composer cache misses.
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

jobs:
  sonarqube:
    name: SonarQube Cloud scan
    # A run Dependabot triggers gets Dependabot's secrets, not Actions',
    # so SONAR_TOKEN is empty there; its PRs only move dependencies.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # kinetis/vector has no suite of its own: the demo's PHPUnit suite is
    # its suite, and it boots the demo against these databases, as in
    # ci.yml's PHP job.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: vector
          MYSQL_USER: vector
          MYSQL_PASSWORD: vector
          MYSQL_ROOT_PASSWORD: vector
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pvector"
          --health-interval=5s --health-timeout=3s --health-retries=20
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vector_admin
          POSTGRES_USER: vector
          POSTGRES_PASSWORD: vector
        options: >-
          --health-cmd="pg_isready -U vector -d vector_admin"
          --health-interval=5s --health-timeout=3s --health-retries=20
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      VECTOR_PHP_IMAGE: vector-php:8.4
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarQube Cloud's new-code/blame analysis needs real history,
          # not the default single-commit shallow clone.
          fetch-depth: 0

      - name: Join the service network
        # .github/scripts/php runs on the network GitHub created for this
        # job's services, where they answer to their keys as host names.
        run: echo "VECTOR_CI_NETWORK=${{ job.services.mysql.network }}" >> "$GITHUB_ENV"

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/composer-cache
          key: composer-${{ hashFiles('demo/backend/composer.lock') }}
          restore-keys: composer-

      - name: Build the demo's PHP image
        # pcov is part of the demo's extension recipe already.
        run: docker build --progress=plain --build-arg PHP_VERSION=8.4 --target fpm -t "$VECTOR_PHP_IMAGE" -f demo/docker/Dockerfile demo

      - name: Install dependencies
        run: .github/scripts/php composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare the demo databases
        # As in ci.yml's PHP job.
        run: |
          cp demo/backend/.env.example demo/backend/.env
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"
          docker exec "${{ job.services.postgres.id }}" psql -U vector -d vector_admin -c 'CREATE DATABASE vector_support OWNER vector'

      - name: Migrate and seed
        run: |
          .github/scripts/php vendor/bin/kinetis migrate
          .github/scripts/php vendor/bin/kinetis demo:seed

      - name: Package coverage
        # pcov instruments only files under pcov.directory, which
        # defaults to the working directory's src/ — the demo's, not the
        # package's — so it is pointed at packages/vector.
        #
        # kinetis/vector is installed from the path repository as a
        # symlink (vendor/kinetis/vector -> ../../../../packages/vector),
        # and PHP reports a loaded file by its resolved path, so the
        # clover file names /workspace/packages/vector/src/..., the
        # container's view of the checkout (.github/scripts/php mounts it
        # at /workspace). The scanner runs on the runner, where the same
        # files are under $GITHUB_WORKSPACE: the prefix is rewritten to
        # that, leaving every path an existing file under
        # packages/vector/src, which sonar-project.properties lists as a
        # source.
        run: |
          .github/scripts/php php -d pcov.directory=/workspace/packages/vector vendor/bin/phpunit --coverage-clover=coverage.xml
          .github/scripts/php sed -i "s#name=\"/workspace/#name=\"$GITHUB_WORKSPACE/#" coverage.xml

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Cloud quality gate
        # Fails the build if the gate fails — the scan step only uploads.
        # Reads the scan's report-task.txt and polls SonarQube Cloud until
        # the gate resolves.
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
