name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per branch at a time: a superseded PR push cancels the older
# run outright; on main nothing is cancelled, but stacked pushes queue
# as at most one pending run instead of piling their whole job matrix
# behind each other's.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The Composer cache below removes almost every download; this covers
  # what is left — a cold cache, or a lock file that just changed. The
  # job's own ephemeral token lifts the anonymous codeload.github.com
  # rate limit. No secret to provision.
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # dorny/paths-filter lists a pull request's files through the API.
      pull-requests: read
    outputs:
      php: ${{ steps.filter.outputs.php }}
      node: ${{ steps.filter.outputs.node }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      # dorny/paths-filter needs a real checkout for a push trigger (it
      # diffs against the previous commit with plain git there, while a
      # pull_request uses the API) — fetch-depth: 0 so that commit is
      # present even for a multi-commit push.
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            php:
              - 'packages/vector/**'
              - 'demo/backend/**'
              - 'demo/docker/**'
              - '.github/scripts/php'
              - '.github/workflows/ci.yml'
            node:
              - 'packages/vector-ui/**'
              - 'demo/frontend/**'
              - 'demo/e2e/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'eslint.config.mjs'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - '.github/workflows/ci.yml'

  php:
    needs: changes
    # Every push to main runs both stacks whatever it touched, so main's
    # own CI status always speaks for the code at that commit. Pull
    # requests keep the path filter.
    if: github.event_name == 'push' || needs.changes.outputs.php == 'true'
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # the Psalm SARIF upload to code scanning
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # composer.json requires ^8.4; demo/docker/Dockerfile defaults to
        # 8.4 and builds on 8.5 with the same extension recipe. php-image
        # is the patch release each job builds on: at least 8.4.27 and
        # 8.5.12, raised with the Dockerfile's default.
        include:
          - php-version: '8.4'
            php-image: '8.4.27'
          - php-version: '8.5'
            php-image: '8.5.12'
    # The suite boots the demo against its seeded databases, as it does
    # in the Compose stack: the shop on MySQL, Vector's own tables and
    # the support desk on PostgreSQL, the queue and cache on Redis. Same
    # images, databases and credentials as demo/docker-compose.yml and
    # demo/backend/.env.example, under the Compose service names as host
    # names (see .github/scripts/php).
    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_DATABASE: vector
          MYSQL_USER: vector
          MYSQL_PASSWORD: vector
          MYSQL_ROOT_PASSWORD: vector
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pvector"
          --health-interval=5s --health-timeout=3s --health-retries=20
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vector_admin
          POSTGRES_USER: vector
          POSTGRES_PASSWORD: vector
        options: >-
          --health-cmd="pg_isready -U vector -d vector_admin"
          --health-interval=5s --health-timeout=3s --health-retries=20
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      VECTOR_PHP_IMAGE: vector-php:${{ matrix.php-version }}
    steps:
      - uses: actions/checkout@v7

      - name: Join the service network
        # .github/scripts/php runs on the network GitHub created for this
        # job's services, where they answer to their keys as host names.
        run: echo "VECTOR_CI_NETWORK=${{ job.services.mysql.network }}" >> "$GITHUB_ENV"

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/composer-cache
          key: composer-${{ hashFiles('demo/backend/composer.lock') }}
          restore-keys: composer-

      - name: Build the demo's PHP image
        # The fpm target of the stack's own Dockerfile, so CI runs on the
        # extensions the demo runs on; see .github/scripts/php. Plain
        # progress keeps every RUN's output in the log, so a failed
        # php-extensions.sh shows which download or compile broke. The
        # token, a BuildKit secret, lifts PIE's GitHub API downloads off
        # the runner IP's anonymous rate limit and never enters a layer.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker build --progress=plain --secret id=github_token,env=GITHUB_TOKEN --build-arg PHP_VERSION=${{ matrix.php-image }} --target fpm -t "$VECTOR_PHP_IMAGE" -f demo/docker/Dockerfile demo

      - name: Validate composer.json
        run: |
          .github/scripts/php composer validate --strict ../../packages/vector/composer.json
          .github/scripts/php composer validate --strict

      - name: Install dependencies
        run: .github/scripts/php composer install --no-interaction --prefer-dist --no-progress

      - name: Composer audit
        run: .github/scripts/php composer audit

      - name: Prepare the demo databases
        # backend/.env.example is the configuration the suite expects,
        # its hosts the services' names. The JWT secret is
        # this run's own: bootstrap.php requires one of at least 32 bytes.
        # The support desk's database is the one docker/postgres creates
        # at the stack's first start; a service container runs no init
        # scripts.
        run: |
          cp demo/backend/.env.example demo/backend/.env
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"
          docker exec "${{ job.services.postgres.id }}" psql -U vector -d vector_admin -c 'CREATE DATABASE vector_support OWNER vector'

      - name: Migrate and seed
        run: |
          .github/scripts/php vendor/bin/kinetis migrate
          .github/scripts/php vendor/bin/kinetis demo:seed

      - name: PHPUnit (Vector's tables on PostgreSQL)
        run: .github/scripts/php vendor/bin/phpunit

      - name: PHPUnit (Vector's tables on MySQL)
        env:
          VECTOR_TEST_DB_CONNECTION: default
        run: .github/scripts/php vendor/bin/phpunit

      - name: PHPStan
        run: .github/scripts/php composer phpstan

      # One run reports both ordinary and taint issues (Psalm 7).
      - name: Psalm
        # writes demo/backend/psalm.sarif
        run: .github/scripts/php composer psalm

      - name: Upload Psalm SARIF to code scanning
        # Soft-fails rather than reddening the run over a dashboard step
        # when code scanning is unavailable for the repository.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: demo/backend/psalm.sarif
          category: psalm-php${{ matrix.php-version }}

  php-without-failed-jobs:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.php == 'true'
    # kinetis/vector only suggests kinetis/queue-failed-jobs, but the demo
    # requires it, so the php job never boots Vector without it. This job
    # removes it from the demo, in this run's checkout only, and boots the
    # application the way the suite does: any hard reference to one of its
    # classes on the boot or request path fails here.
    name: PHP 8.4 without kinetis/queue-failed-jobs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The php job's services, images and credentials (see there).
    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_DATABASE: vector
          MYSQL_USER: vector
          MYSQL_PASSWORD: vector
          MYSQL_ROOT_PASSWORD: vector
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pvector"
          --health-interval=5s --health-timeout=3s --health-retries=20
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vector_admin
          POSTGRES_USER: vector
          POSTGRES_PASSWORD: vector
        options: >-
          --health-cmd="pg_isready -U vector -d vector_admin"
          --health-interval=5s --health-timeout=3s --health-retries=20
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      VECTOR_PHP_IMAGE: vector-php:8.4
    steps:
      - uses: actions/checkout@v7

      - name: Join the service network
        run: echo "VECTOR_CI_NETWORK=${{ job.services.mysql.network }}" >> "$GITHUB_ENV"

      - name: Restore Composer downloads
        # Restore only: this job's install lacks one package, and must not
        # save that cache under the key the php job shares.
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/composer-cache
          key: composer-${{ hashFiles('demo/backend/composer.lock') }}
          restore-keys: composer-

      - name: Build the demo's PHP image
        # As the php job builds it; PHP_VERSION is that job's 8.4 php-image.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker build --progress=plain --secret id=github_token,env=GITHUB_TOKEN --build-arg PHP_VERSION=8.4.27 --target fpm -t "$VECTOR_PHP_IMAGE" -f demo/docker/Dockerfile demo

      - name: Install dependencies without kinetis/queue-failed-jobs
        # Drops the requirement from this run's composer.json, then a
        # partial update removes the package and leaves every other locked
        # version, kinetis/vector's path repository included, as it is.
        # Nothing else in the lock requires it. The test below skips
        # wherever the package is still there, so the check makes sure it
        # is not.
        run: |
          .github/scripts/php composer remove kinetis/queue-failed-jobs --no-update --no-interaction
          .github/scripts/php composer update kinetis/queue-failed-jobs --no-interaction --prefer-dist --no-progress
          .github/scripts/php sh -c 'test ! -e vendor/kinetis/queue-failed-jobs'

      - name: Prepare the demo databases
        # As the php job prepares them.
        run: |
          cp demo/backend/.env.example demo/backend/.env
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"
          docker exec "${{ job.services.postgres.id }}" psql -U vector -d vector_admin -c 'CREATE DATABASE vector_support OWNER vector'

      - name: Migrate and seed
        # Every migration runs, kinetis_failed_jobs' included: it is plain
        # SQL and names none of the package's classes.
        run: |
          .github/scripts/php vendor/bin/kinetis migrate
          .github/scripts/php vendor/bin/kinetis demo:seed

      - name: PHPUnit (Vector's queue tests that need nothing of the package)
        # FailedJobsNotInstalledTest is the point of this job; the other
        # three never touch kinetis/queue-failed-jobs. The rest of
        # tests/Vector/Queues builds its store in setUp(), so it is left
        # out. --fail-on-skipped: a skip here means the package was there.
        run: >-
          .github/scripts/php vendor/bin/phpunit --fail-on-skipped
          --filter 'FailedJobsNotInstalledTest|QueuesUnconfiguredTest|QueuesWidgetTest|DemoQueueDashboardPolicyTest'
          tests/Vector/Queues

  node:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.node == 'true'
    name: Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm's version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # package.json's engines floor, and the demo's node:26 service
          node-version: '26'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Vitest
        run: pnpm test

      - name: Script tests
        run: pnpm test:scripts

      - name: The hosted bundle is in the npm package
        # Builds the bundle @kinetis/vector-ui ships, as a release does,
        # packs the package with npm and lists the tarball:
        # vector-bundle.json and every file it lists must be in it,
        # dotfiles included.
        run: |
          pnpm generate:hosted
          node scripts/check-vector-ui-pack.mjs --packed

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Sphinx docs
        run: |
          docker run --rm -v "$PWD/docs":/docs -w /docs python:3.12-slim \
            sh -c "pip install -q -r requirements.txt && sphinx-build -W --keep-going -b html . _build/html && python -m pagefind --site _build/html"

      - name: Check URL baseline
        run: python3 docs/tools/check_url_baseline.py check docs/_build/html

      - name: Test URL baseline checker
        run: python3 -m unittest docs/tools/test_check_url_baseline.py
