version: 2

updates:
  - package-ecosystem: "composer"
    directory: "/packages/vector"
    schedule:
      interval: "weekly"

  - package-ecosystem: "composer"
    directory: "/demo/backend"
    schedule:
      interval: "weekly"

  # The pnpm workspace: the root, @kinetis/vector-ui, the demo frontend
  # and the end-to-end suite share the one root pnpm-lock.yaml.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
