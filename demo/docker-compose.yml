# The demo stack: the Kinetis application in backend/, its Nuxt app in
# frontend/, and the two packages they consume from ../packages. The
# repository is mounted whole so Composer's path repository and pnpm's
# workspace resolve inside the containers; each service works in its
# own directory. The project name is fixed so the volumes stay the same
# whatever directory this file lives in.
name: vector

x-php: &php
  # One image for app and worker, and the frankenphp service's built from
  # the same Dockerfile and extension recipe (docker/php-extensions.sh),
  # so a rebuild can never leave one of them on the previous extensions.
  image: vector-php-fpm
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: fpm
  working_dir: /workspace/demo/backend
  volumes:
    - ..:/workspace
    - vendor:/workspace/demo/backend/vendor
    - storage:/var/lib/vector-storage
    # the file session store, shared so one browser session holds on 8080 and 8081
    - sessions:/tmp/kinetis-sessions
  env_file: backend/.env
  depends_on:
    mysql:
      condition: service_healthy
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *php

  # The application's queue worker: the same image and mounts as app,
  # running `kinetis queue:work` instead of PHP-FPM. SIGTERM lets it
  # finish the job in flight; the grace period must exceed the slowest job. It serves the application's jobs on
  # "default" and Vector's on "vector" (VECTOR_QUEUE), in that priority.
  worker:
    <<: *php
    command: ["php", "vendor/bin/kinetis", "queue:work", "--queue=default,vector"]
    # A worker that fails at boot (a mapping error during development, a
    # database not up yet) comes back instead of leaving jobs unrun.
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 60s

  # The same application under FrankenPHP worker mode, Kinetis's primary
  # runtime, on its own port: each of its threads boots the application
  # once and serves request after request, on the native non-blocking
  # database drivers (DB_DRIVER=auto selects them here). nginx and
  # PHP-FPM on 8080 are unchanged. A worker keeps the code it booted
  # with: after editing PHP, `docker compose restart frankenphp`.
  frankenphp:
    <<: *php
    image: vector-php-frankenphp
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: frankenphp
    environment:
      # Worker threads (docker/Caddyfile). Every thread builds its own
      # pool per connection, so threads × pool width is the connection
      # budget: 12 × 4 = 48 MySQL connections of max_connections 151, and
      # 12 × (2 + 2) = 48 PostgreSQL connections (admin + support) of 100,
      # leaving room for PHP-FPM, the queue worker, migrations and the
      # test suite. Raise one, recompute the other; docs/demo.md.
      FRANKENPHP_WORKERS: "12"
      DB_MAX_CONNECTIONS: "4"
      DB_ADMIN_MAX_CONNECTIONS: "2"
      DB_SUPPORT_MAX_CONNECTIONS: "2"
      # mysqli waits through select(), which cannot see a descriptor
      # numbered above 1024: connections opened at boot get low numbers
      # and keep them, before any client socket exists.
      DB_WARM_CONNECTIONS: "4"
    ports:
      - "8081:8081"
    healthcheck:
      # A worker answered through the Kernel: the token API refuses an
      # anonymous GET /auth/me with 401. It needs neither the hosted
      # bundle nor a seeded database, and it starts no session, which a
      # probe of the sign-in page would, every 5 s.
      test: ["CMD-SHELL", "[ \"$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/auth/me)\" = 401 ]"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s

  nginx:
    image: nginx:alpine
    volumes:
      - ..:/workspace
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # NGINX_HOST_PORT moves only the host side, when 8080 is taken; the
      # e2e service forwards its own localhost:8080 to nginx:8080 either
      # way. The standalone UI on :3000 still calls localhost:8080 from
      # the host's browser unless NUXT_PUBLIC_VECTOR_API_BASE says otherwise.
      - "${NGINX_HOST_PORT:-8080}:8080"
    depends_on:
      app:
        condition: service_started

  # The demo's PostgreSQL server, two databases: vector_admin holds
  # Vector's own tables (the named connection "admin",
  # VECTOR_DB_CONNECTION=admin), vector_support the support-desk domain
  # (the named connection "support"). The shop domain stays on MySQL.
  # pg_stat_statements counts the statements each client sends, which
  # bin/benchmark reports per request.
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_DB: ${DB_ADMIN_NAME:-vector_admin}
      POSTGRES_USER: ${DB_ADMIN_USER:-vector}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-vector}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER:-vector} -d ${DB_ADMIN_NAME:-vector_admin}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The application's queue backend (the named queue connection "jobs":
  # QUEUE_JOBS_CONNECTION=redis, REDIS_JOBS_HOST=redis). Append-only persistence,
  # so queued jobs survive a restart of this container.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-vector}
      MYSQL_USER: ${DB_USER:-vector}
      MYSQL_PASSWORD: ${DB_PASSWORD:-vector}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-vector}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql:/var/lib/mysql
    ports:
      # MYSQL_HOST_PORT moves only the host side, when 3306 is taken;
      # the services reach mysql:3306 on the project network either way.
      - "${MYSQL_HOST_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-vector}"]
      interval: 5s
      timeout: 3s
      retries: 20

  node:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && corepack prepare pnpm@10.17.1 --activate && pnpm install --frozen-lockfile=false && pnpm --filter frontend dev"
    environment:
      NUXT_PUBLIC_VECTOR_API_BASE: http://localhost:8080
      NUXT_TELEMETRY_DISABLED: "1"
      CI: "1"
    volumes:
      - ..:/workspace
      - node_modules:/workspace/node_modules
      - node_modules_ui:/workspace/packages/vector-ui/node_modules
      - node_modules_admin:/workspace/demo/frontend/node_modules
      - node_modules_e2e:/workspace/demo/e2e/node_modules
    ports:
      - "3000:3000"

  # The end-to-end suite (demo/e2e): Playwright and its browsers, driving
  # both the standalone UI (node) and the hosted one (nginx). Not started
  # by `up`; run it with `docker compose run --rm e2e`, and pass
  # Playwright's own arguments after the service name. Its packages are
  # the workspace's, installed by the node service. The image tag and
  # @playwright/test in e2e/package.json must name the same version.
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: [e2e]
    working_dir: /workspace/demo/e2e
    entrypoint: ["./node_modules/.bin/playwright"]
    command: ["test"]
    environment:
      # the browser runs here, not on the host: localhost:3000 and :8080 are forwarded to node and nginx
      E2E_FORWARD: "node:3000,nginx:8080"
      CI: "1"
    init: true
    ipc: host
    volumes:
      - ..:/workspace
      - node_modules:/workspace/node_modules
      - node_modules_e2e:/workspace/demo/e2e/node_modules
    depends_on:
      nginx:
        condition: service_started
      node:
        condition: service_started

  # The load generator for bin/benchmark: not started by `up`.
  oha:
    image: ghcr.io/hatoo/oha:1.16.0
    profiles: [bench]
    depends_on:
      nginx:
        condition: service_started
      frankenphp:
        condition: service_healthy

volumes:
  vendor:
  storage:
  sessions:
  mysql:
  postgres:
  redis:
  node_modules:
  node_modules_ui:
  node_modules_admin:
  node_modules_e2e:
