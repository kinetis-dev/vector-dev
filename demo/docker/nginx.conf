server {
    listen 8080;

    # Resolve the Compose service at request time so recreating the app
    # container does not leave nginx pinned to its previous address.
    resolver 127.0.0.11 valid=5s ipv6=off;

    root /workspace/demo/backend/public;
    index index.php;

    # nginx reads the body before PHP does, so this must be at least
    # Kinetis's MAX_BODY_SIZE; raise both together.
    client_max_body_size 12m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # The demo's runtime extensions change while you work on them: the
    # browser revalidates them on every load (a 304 when unchanged),
    # as the standalone UI on :3000 serves them, instead of guessing a
    # freshness from Last-Modified and running a stale copy for hours.
    location /vector-extensions/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~ \.php$ {
        set $php_fpm app:9000;
        fastcgi_pass $php_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /workspace/demo/backend/public/index.php;
        include fastcgi_params;
    }
}
