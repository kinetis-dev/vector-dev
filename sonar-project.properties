# SonarQube Cloud configuration, read by .github/workflows/sonarqube.yml.
#
# `sonar.organization`/`sonar.projectKey` must match the values on the
# project's own SonarCloud dashboard.
sonar.organization=kinetis-dev
sonar.projectKey=kinetis-dev_vector-dev
sonar.projectName=Vector

# The two packages Vector is delivered as. The demo application is how
# they are tested, not what is delivered, so it is not a source.
sonar.sources=\
  packages/vector/src,\
  packages/vector-ui

# kinetis/vector's suite is the demo's PHPUnit suite; the UI layer's is
# its Vitest suite, which sits inside the layer's directory and so is
# also excluded from the sources below.
sonar.tests=\
  demo/backend/tests,\
  packages/vector-ui/test

# Installed and generated output, never source: dependencies, Nuxt's
# .nuxt/ and .output/, and the hosted bundle's dist/.
sonar.exclusions=\
  **/vendor/**,\
  **/node_modules/**,\
  **/.nuxt/**,\
  **/.output/**,\
  **/dist/**,\
  packages/vector-ui/test/**

sonar.sourceEncoding=UTF-8

# The clover report sonarqube.yml writes from the demo's suite under
# pcov, its paths rewritten to the runner's checkout so they name the
# files under packages/vector/src (see that workflow's own comment).
sonar.php.coverage.reportPaths=demo/backend/coverage.xml

# The UI layer's Vitest suite has no coverage setup, so no lcov report
# reaches the scan; without this its files would read as 0% covered and
# new UI code would fail the coverage condition for a measurement this
# job does not make.
sonar.coverage.exclusions=packages/vector-ui/**

# One message catalogue per locale, every one with the same keys in the
# same order. Duplication detection ignores what a string literal says,
# so seventeen translations of one catalogue read as sixteen copies of
# it; a key added to all of them is not duplicated code.
sonar.cpd.exclusions=packages/vector-ui/app/i18n/*/**

# The hosted UI is written world-readable on purpose — files 0644,
# directories 0755 — because it is the public bundle every browser is
# sent, and whatever serves it need not be the user that installed it.
# S2612 reads that as a loose permission; it is the intended one, in
# these three files only.
sonar.issue.ignore.multicriteria=uiModes1,uiModes2,uiModes3
sonar.issue.ignore.multicriteria.uiModes1.ruleKey=php:S2612
sonar.issue.ignore.multicriteria.uiModes1.resourceKey=packages/vector/src/Ui/TarReader.php
sonar.issue.ignore.multicriteria.uiModes2.ruleKey=php:S2612
sonar.issue.ignore.multicriteria.uiModes2.resourceKey=packages/vector/src/Ui/UiInstaller.php
sonar.issue.ignore.multicriteria.uiModes3.ruleKey=php:S2612
sonar.issue.ignore.multicriteria.uiModes3.resourceKey=packages/vector/src/Console/InstallUiCommand.php
